name: publish

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install."
        required: false
        type: string
        default: "24"
      npm-scope:
        description: "npm scope used for registry auth (e.g. @aliou)."
        required: false
        type: string
        default: "@aliou"

jobs:
  publish:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          scope: ${{ inputs.npm-scope }}
          cache: "pnpm"

      - name: Upgrade npm for stage publish support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get release info
        id: release-info
        run: |
          pnpm changeset status --output=release.json 2>/dev/null || echo '{"releases":[]}' > release.json
          node <<NODE
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const releases = release.releases?.filter(r => r.type !== 'none') || [];

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageName = pkg.name || 'unknown-package';
          const fallbackVersion = pkg.version || '0.0.0';

          let title = 'Updating ' + packageName + ' to version ' + fallbackVersion;
          let commit = packageName + '@' + fallbackVersion;
          if (releases.length === 1) {
            const { name, newVersion } = releases[0];
            title = 'Updating ' + name + ' to version ' + newVersion;
            commit = name + '@' + newVersion;
          } else if (releases.length > 1) {
            const summary = releases.map(r => r.name + '@' + r.newVersion).join(', ');
            title = 'Updating ' + summary;
            commit = summary;
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + title + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + commit + '\n');
          NODE
          rm -f release.json
        continue-on-error: true

      - name: Create Release PR or Stage
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: ${{ steps.release-info.outputs.title }}
          commit: ${{ steps.release-info.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unpublished packages
        id: check-publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          # npm view can't see staged versions, so also check the staging area
          # to avoid re-staging a version that's waiting for 2FA approval.
          if npm view "$PACKAGE_NAME@$LOCAL_VERSION" version >/dev/null 2>&1; then
            echo "needs_staging=false" >> "$GITHUB_OUTPUT"
          elif npm stage list "$PACKAGE_NAME" 2>/dev/null | grep -q "$LOCAL_VERSION"; then
            echo "needs_staging=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL_VERSION is staged and awaiting approval."
          else
            echo "needs_staging=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage packages
        if: steps.check-publish.outputs.needs_staging == 'true'
        run: |
          set -o pipefail
          if ! npm stage publish 2>&1 | tee stage.log; then
            # Another run may have staged the version in the meantime.
            if grep -qE 'E409|previously published' stage.log; then
              echo "Version already staged or published; nothing to do."
              exit 0
            fi
            exit 1
          fi
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub releases
        if: steps.check-publish.outputs.needs_staging == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check-publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release creation."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="$VERSION" '
              $0 == "## " v { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > /tmp/release-notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
